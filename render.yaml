services:
  - type: web
    name: own-gpt-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NOVIN_API_KEY
        sync: false
      - key: NOVIN_BASE_URL
        value: https://iapi.novin.cloud/v1
      - key: NOVIN_MODEL
        value: openai/gpt-4o-mini
